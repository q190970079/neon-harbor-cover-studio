<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="brand-mark">NH</span>
    <div>
      <h1>Neon Harbor Cover Studio</h1>
      <p>Turn your own photos into a multi-panel open-world cover.</p>
    </div>
  </div>
</header>

<main class="workspace">
  <aside class="controls" aria-label="Cover controls">
    <section class="group">
      <h2>Photos</h2>
      <label class="file-btn">
        Add your photos
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </label>
      <button id="loadSamples" type="button" class="ghost-btn">Load sample set</button>
      <p id="photoCount" class="hint">No photos yet.</p>
    </section>

    <section class="group">
      <h2>Panels</h2>
      <div id="panelList" class="panel-list"></div>
      <p id="selectedLabel" class="hint">Editing panel 1</p>
      <label class="slider-row">Zoom
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      </label>
      <label class="slider-row">Offset X
        <input id="offsetX" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label class="slider-row">Offset Y
        <input id="offsetY" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <p class="hint">Tip: click a panel on the canvas, then drag to pan its photo.</p>
    </section>

    <section class="group">
      <h2>Look</h2>
      <label class="field">Layout
        <select id="layout"></select>
      </label>
      <label class="field">Theme
        <select id="theme"></select>
      </label>
    </section>

    <section class="group">
      <h2>Words</h2>
      <label class="field">Title
        <input id="title" type="text" value="NEON HARBOR" maxlength="40" autocomplete="off">
      </label>
      <label class="field">Tagline
        <input id="tagline" type="text" value="SUNSET SYNDICATE" maxlength="48" autocomplete="off">
      </label>
    </section>

    <section class="group">
      <h2>Export</h2>
      <label class="field">Size
        <select id="size"></select>
      </label>
      <button id="exportBtn" type="button" class="export-btn">Export PNG</button>
    </section>
  </aside>

  <section class="stage">
    <p id="status" class="status" role="status">Loading the sample set…</p>
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
  </section>
</main>

<script type="module" src="./src/studio.js"></script>
</body>
</html>
