<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="controls">
    <header class="masthead">
      <h1>Neon Harbor <span>Cover Studio</span></h1>
      <p>Your photos, cut into a multi-panel sunset poster. Bold lettering,
      a neon grade, one PNG — no uploads, everything happens on your machine.</p>
    </header>

    <section class="group">
      <h2>1 · Photos</h2>
      <label class="file-drop">Add your photos
        <input id="photoFiles" type="file" accept="image/*" multiple>
      </label>
      <div class="button-row">
        <button id="loadSamples" type="button">Load sample set</button>
        <button id="clearPhotos" type="button" class="ghost">Clear</button>
      </div>
      <p class="hint">Or add one sample at a time:</p>
      <div id="sampleRow" class="chip-row"></div>
    </section>

    <section class="group">
      <h2>2 · Panels</h2>
      <label>Layout
        <select id="layoutSel"></select>
      </label>
      <div id="panelList" class="panel-list"></div>
      <p id="framingNote" class="hint">Framing the selected panel's photo.</p>
      <label>Zoom
        <input id="zoomRange" type="range" min="1" max="2.5" step="0.01" value="1">
      </label>
      <label>Shift left / right
        <input id="oxRange" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label>Shift up / down
        <input id="oyRange" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
    </section>

    <section class="group">
      <h2>3 · Look</h2>
      <label>Colour grade
        <select id="themeSel"></select>
      </label>
    </section>

    <section class="group">
      <h2>4 · Words</h2>
      <label>Title
        <input id="titleText" type="text" maxlength="30" value="NEON HARBOR">
      </label>
      <label>Tagline
        <input id="taglineText" type="text" maxlength="40" value="SUNSET SYNDICATE">
      </label>
    </section>

    <section class="group">
      <h2>5 · Export</h2>
      <label>Post size
        <select id="sizeSel"></select>
      </label>
      <button id="exportBtn" type="button" class="export">Export PNG</button>
      <p id="statusLine" role="status" class="status"></p>
    </section>
  </aside>

  <section class="stage-wrap">
    <canvas id="stage" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
