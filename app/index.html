<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>NEON HARBOR <span>COVER STUDIO</span></h1>
  <p>Turn your own photos into a multi-panel open-world cover.</p>
</header>
<main>
  <aside id="controls">
    <section>
      <h2>Photos</h2>
      <label class="file-btn">Add photos<input id="fileInput" type="file" accept="image/*" multiple hidden></label>
      <button id="sampleBtn" type="button">Load sample set</button>
      <div id="photoList" class="chips"></div>
      <label>Zoom <input id="scaleRange" type="range" min="1" max="2.6" step="0.01" value="1"></label>
      <label>Pan X <input id="oxRange" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Pan Y <input id="oyRange" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </section>
    <section>
      <h2>Panels</h2>
      <div id="panelList"></div>
      <p class="hint">Use &lt; &gt; to swap a panel's photo, or click the cover and drag to reframe.</p>
    </section>
    <section>
      <h2>Look</h2>
      <label>Layout
        <select id="layoutSel">
          <option value="hero">Hero + Trio</option>
          <option value="stripes">Slanted Stripes</option>
          <option value="banner">Banner + Three</option>
        </select>
      </label>
      <label>Theme
        <select id="themeSel">
          <option value="sunset">Sunset</option>
          <option value="neon">Neon</option>
          <option value="gold">Gold</option>
          <option value="midnight">Midnight</option>
        </select>
      </label>
    </section>
    <section>
      <h2>Words</h2>
      <label>Title <input id="titleInput" type="text" value="NEON HARBOR" maxlength="30"></label>
      <label>Tagline <input id="taglineInput" type="text" value="SUNSET SYNDICATE" maxlength="40"></label>
    </section>
    <section>
      <h2>Export</h2>
      <label>Size
        <select id="sizeSel">
          <option value="1080x1080">1080 x 1080 (square)</option>
          <option value="1080x1350">1080 x 1350 (portrait)</option>
          <option value="1920x1080">1920 x 1080 (wide)</option>
        </select>
      </label>
      <button id="exportBtn" type="button" class="primary">Export PNG</button>
    </section>
    <p id="status" class="status">Loading samples...</p>
  </aside>
  <div id="stage">
    <canvas id="preview" width="1080" height="1080"></canvas>
  </div>
</main>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
